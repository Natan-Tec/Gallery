name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar chave de debug (se não existir)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK (release)
        run: gradle assembleRelease --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LeveGaleria-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Criar pré-release (quando for uma tag)
        if: contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.1-pre
        run: |
          cp app/build/outputs/apk/release/app-release.apk "LeveGaleria-${TAG}.apk"
          gh release delete v1.0.0-pre --cleanup-tag --yes || true
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "LeveGaleria-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Leve Galeria ${TAG} (pré-release)" \
            --notes "Pré-release da Leve Galeria.

          Correção: o app fechava logo ao abrir.

          - Fotos agrupadas por dia, com filtros (Tudo, Fotos, Vídeos, Favoritos)
          - Álbuns e pastas ocultáveis (Ajustes > Pastas)
          - Visualizador com zoom, favoritos, compartilhar, excluir e detalhes
          - Seleção múltipla, tema claro/escuro e grade de 2 a 6 colunas
          - Android 8.0 ou mais novo

          Instalação: baixe o APK, instale e permita acesso às fotos.
          APK assinado com chave de debug; para atualizar, desinstale a versão anterior."

  diagnose:
    needs: build
    if: contains(github.event.head_commit.message, '[diag]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: LeveGaleria-apk
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Testar no emulador (Android 10)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash .github/diag.sh
